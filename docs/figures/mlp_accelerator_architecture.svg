<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1560" viewBox="0 0 1240 1560" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="aGray" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#37474f"/></marker>
    <marker id="aBlue" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#1565c0"/></marker>
    <marker id="aAmber" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#ef6c00"/></marker>
    <marker id="aPurple" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#7e57c2"/></marker>
    <marker id="aGold" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#c77800"/></marker>
    <linearGradient id="psGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eceff1"/><stop offset="1" stop-color="#cfd8dc"/></linearGradient>
    <linearGradient id="plGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e8f4fe"/><stop offset="1" stop-color="#d4eafb"/></linearGradient>
    <style>
      .title{font-size:30px;font-weight:700;fill:#102027;}
      .sub{font-size:15px;fill:#455a64;}
      .region{font-size:18px;font-weight:700;}
      .block{font-size:16px;font-weight:600;fill:#0d2733;}
      .small{font-size:13px;fill:#37474f;}
      .tiny{font-size:11px;fill:#546e7a;}
      .stage{font-size:14px;font-weight:600;fill:#0d2733;}
      .wlbl{font-size:12px;font-weight:600;fill:#1565c0;}
      .flbl{font-size:12px;font-weight:600;fill:#ef6c00;}
      .clbl{font-size:11px;font-weight:600;fill:#5e35b1;}
      .glbl{font-size:11px;font-weight:600;fill:#c77800;}
      .dlbl{font-size:11px;fill:#455a64;}
    </style>
  </defs>

  <text x="620" y="44" text-anchor="middle" class="title">FPGA-Based Pipelined MLP Inference Accelerator</text>
  <text x="620" y="70" text-anchor="middle" class="sub">SIMD 4-Layer Perceptron (40-64-32-16-3) on Zynq-7000 / ZedBoard &#8226; Q8.8 Fixed-Point</text>

  <!-- Processing System -->
  <rect x="40" y="96" width="1160" height="150" rx="12" fill="url(#psGrad)" stroke="#90a4ae" stroke-width="1.5"/>
  <text x="62" y="122" class="region" fill="#37474f">Processing System (PS) &#8212; ARM Cortex-A9</text>
  <rect x="70" y="138" width="320" height="86" rx="8" fill="#ffffff" stroke="#78909c" stroke-width="1.5"/>
  <text x="230" y="166" text-anchor="middle" class="block">Host CPU / Driver</text>
  <text x="230" y="190" text-anchor="middle" class="small">Loads model, streams features</text>
  <text x="230" y="208" text-anchor="middle" class="small">Reads classification result</text>
  <rect x="440" y="138" width="300" height="86" rx="8" fill="#ffffff" stroke="#78909c" stroke-width="1.5"/>
  <text x="590" y="166" text-anchor="middle" class="block">DMA Engine</text>
  <text x="590" y="190" text-anchor="middle" class="small">Memory-to-stream transfer</text>
  <text x="590" y="208" text-anchor="middle" class="small">Feeds the feature vector</text>
  <rect x="790" y="138" width="380" height="86" rx="8" fill="#ffffff" stroke="#78909c" stroke-width="1.5"/>
  <text x="980" y="166" text-anchor="middle" class="block">DDR Memory</text>
  <text x="980" y="190" text-anchor="middle" class="small">Model parameters + I/O buffers</text>

  <!-- AXI buses PS to PL -->
  <line x1="230" y1="246" x2="230" y2="360" stroke="#1565c0" stroke-width="2.5" marker-end="url(#aBlue)"/>
  <text x="242" y="300" class="wlbl">AXI4-Lite  (control / config / weights)</text>
  <line x1="590" y1="246" x2="590" y2="360" stroke="#1565c0" stroke-width="2.5" marker-end="url(#aBlue)"/>
  <text x="602" y="300" class="wlbl">AXI4-Stream  (feature vector)</text>

  <!-- Programmable Logic -->
  <rect x="40" y="320" width="1160" height="1140" rx="12" fill="url(#plGrad)" stroke="#64b5f6" stroke-width="1.5"/>
  <text x="62" y="346" class="region" fill="#0d47a1">Programmable Logic (PL) &#8212; Custom Accelerator IP</text>

  <!-- Wrapper -->
  <rect x="70" y="362" width="1100" height="150" rx="10" fill="#ffffff" stroke="#1976d2" stroke-width="1.6"/>
  <text x="90" y="386" class="block" fill="#0d47a1">Bus Adapter &amp; Sequencing Wrapper</text>
  <rect x="92" y="400" width="320" height="96" rx="7" fill="#e3f2fd" stroke="#64b5f6"/>
  <text x="252" y="424" text-anchor="middle" class="stage">Control &amp; Status Registers</text>
  <text x="252" y="446" text-anchor="middle" class="small">Start / reset, per-layer widths</text>
  <text x="252" y="464" text-anchor="middle" class="small">Done / busy flags</text>
  <rect x="440" y="400" width="300" height="96" rx="7" fill="#e3f2fd" stroke="#64b5f6"/>
  <text x="590" y="424" text-anchor="middle" class="stage">Stream Intake FSM</text>
  <text x="590" y="446" text-anchor="middle" class="small">Unpacks 2 samples / word</text>
  <text x="590" y="464" text-anchor="middle" class="small">Fills input buffer, fires start</text>
  <rect x="768" y="400" width="380" height="96" rx="7" fill="#e3f2fd" stroke="#64b5f6"/>
  <text x="958" y="424" text-anchor="middle" class="stage">Parameter Write Demux</text>
  <text x="958" y="446" text-anchor="middle" class="small">Address-decodes parameter banks</text>
  <text x="958" y="464" text-anchor="middle" class="small">Routes to 192 weight + 3 bias RAMs</text>

  <!-- Wrapper to engine (orthogonal, source aligned) -->
  <line x1="252" y1="496" x2="252" y2="720" stroke="#7e57c2" stroke-width="2" marker-end="url(#aPurple)"/>
  <text x="262" y="556" class="clbl">start / config</text>
  <line x1="590" y1="496" x2="590" y2="650" stroke="#37474f" stroke-width="2" marker-end="url(#aGray)"/>
  <text x="600" y="556" class="dlbl">feature samples</text>
  <line x1="958" y1="496" x2="958" y2="740" stroke="#c77800" stroke-width="2" marker-end="url(#aGold)"/>
  <text x="968" y="600" class="glbl">weights / biases</text>

  <!-- Engine -->
  <rect x="70" y="572" width="1100" height="838" rx="10" fill="#ffffff" stroke="#1976d2" stroke-width="1.6"/>
  <text x="90" y="596" class="block" fill="#0d47a1">Pipelined SIMD Compute Engine</text>
  <text x="90" y="616" class="small">3 output neurons computed in parallel &#8226; one shared 12-stage datapath reused for all 4 layers</text>

  <!-- Control column (left) -->
  <rect x="100" y="720" width="320" height="200" rx="8" fill="#ede7f6" stroke="#7e57c2" stroke-width="1.4"/>
  <text x="260" y="746" text-anchor="middle" class="stage" fill="#4527a0">Layer Sequencer (FSM)</text>
  <text x="260" y="772" text-anchor="middle" class="small">Issues neuron groups,</text>
  <text x="260" y="792" text-anchor="middle" class="small">advances layers, drains pipeline</text>
  <text x="260" y="824" text-anchor="middle" class="tiny">Idle &#8594; Issue &#8594; Drain &#8594;</text>
  <text x="260" y="842" text-anchor="middle" class="tiny">(next layer) &#8594; Done</text>
  <text x="260" y="884" text-anchor="middle" class="tiny">Tracks valid / layer tokens</text>
  <text x="260" y="902" text-anchor="middle" class="tiny">flowing through the pipeline</text>

  <rect x="100" y="1110" width="320" height="110" rx="8" fill="#ede7f6" stroke="#7e57c2" stroke-width="1.4"/>
  <text x="260" y="1138" text-anchor="middle" class="stage" fill="#4527a0">Observability</text>
  <text x="260" y="1164" text-anchor="middle" class="small">Per-layer done pulses</text>
  <text x="260" y="1184" text-anchor="middle" class="small">Status LEDs / scope probes</text>

  <line x1="260" y1="920" x2="260" y2="1110" stroke="#7e57c2" stroke-width="2" marker-end="url(#aPurple)"/>
  <text x="270" y="1020" class="clbl">done pulses</text>

  <!-- Datapath column (center) -->
  <rect x="470" y="650" width="360" height="80" rx="8" fill="#fff8e1" stroke="#ffb300" stroke-width="1.4"/>
  <text x="650" y="676" text-anchor="middle" class="stage" fill="#8d6e00">Ping-Pong Activation Buffer (A / B)</text>
  <text x="650" y="700" text-anchor="middle" class="small">Holds input vector; layer N output = layer N+1 input</text>
  <text x="650" y="718" text-anchor="middle" class="tiny">two buffers alternate between layers</text>

  <rect x="470" y="770" width="360" height="110" rx="8" fill="#e8f5e9" stroke="#43a047" stroke-width="1.4"/>
  <text x="650" y="796" text-anchor="middle" class="stage" fill="#1b5e20">Parallel Multiply Array (SIMD MAC)</text>
  <text x="650" y="820" text-anchor="middle" class="small">192 DSP multipliers = 3 neurons &#215; 64 inputs</text>
  <text x="650" y="840" text-anchor="middle" class="small">products: activation[i] &#215; weight[neuron][i]</text>
  <text x="650" y="862" text-anchor="middle" class="tiny">deep DSP registering (MREG + PREG) for high Fmax</text>

  <rect x="470" y="920" width="360" height="150" rx="8" fill="#e8f5e9" stroke="#43a047" stroke-width="1.4"/>
  <text x="650" y="946" text-anchor="middle" class="stage" fill="#1b5e20">Balanced Pipelined Adder Tree</text>
  <text x="650" y="966" text-anchor="middle" class="small">6 stages reduce 64 products &#8594; 1 accumulator (40-bit)</text>
  <g stroke="#66bb6a" stroke-width="1.4" fill="#ffffff">
    <rect x="486" y="980" width="50" height="22" rx="4"/>
    <rect x="542" y="980" width="50" height="22" rx="4"/>
    <rect x="598" y="980" width="50" height="22" rx="4"/>
    <rect x="654" y="980" width="50" height="22" rx="4"/>
    <rect x="710" y="980" width="50" height="22" rx="4"/>
    <rect x="766" y="980" width="50" height="22" rx="4"/>
  </g>
  <g fill="#2e7d32" font-size="10" text-anchor="middle">
    <text x="511" y="995">64&#8594;32</text><text x="567" y="995">32&#8594;16</text><text x="623" y="995">16&#8594;8</text>
    <text x="679" y="995">8&#8594;4</text><text x="735" y="995">4&#8594;2</text><text x="791" y="995">2&#8594;1</text>
  </g>
  <g stroke="#a5d6a7" stroke-width="1.4">
    <line x1="536" y1="991" x2="542" y2="991"/><line x1="592" y1="991" x2="598" y2="991"/>
    <line x1="648" y1="991" x2="654" y2="991"/><line x1="704" y1="991" x2="710" y2="991"/><line x1="760" y1="991" x2="766" y2="991"/>
  </g>
  <text x="650" y="1026" text-anchor="middle" class="small">per-stage registers keep the critical path short</text>
  <text x="650" y="1048" text-anchor="middle" class="tiny">valid / layer-index tokens travel with the data</text>

  <rect x="470" y="1110" width="360" height="110" rx="8" fill="#e8f5e9" stroke="#43a047" stroke-width="1.4"/>
  <text x="650" y="1136" text-anchor="middle" class="stage" fill="#1b5e20">Bias Add, Rescale &amp; Activation</text>
  <text x="650" y="1160" text-anchor="middle" class="small">+ bias &#8594; rescale Q8.8 &#8594; saturate to 16-bit</text>
  <text x="650" y="1180" text-anchor="middle" class="small">ReLU on hidden layers 1&#8211;3</text>
  <text x="650" y="1200" text-anchor="middle" class="tiny">linear (raw) output on final layer 4</text>

  <!-- vertical dataflow arrows (center) -->
  <line x1="650" y1="730" x2="650" y2="770" stroke="#37474f" stroke-width="2.2" marker-end="url(#aGray)"/>
  <text x="660" y="755" class="dlbl">activations</text>
  <line x1="650" y1="880" x2="650" y2="920" stroke="#37474f" stroke-width="2.2" marker-end="url(#aGray)"/>
  <text x="660" y="905" class="dlbl">192 products</text>
  <line x1="650" y1="1070" x2="650" y2="1110" stroke="#37474f" stroke-width="2.2" marker-end="url(#aGray)"/>
  <text x="660" y="1095" class="dlbl">neuron sum</text>

  <!-- control to datapath -->
  <line x1="420" y1="820" x2="470" y2="820" stroke="#7e57c2" stroke-width="2" marker-end="url(#aPurple)"/>
  <text x="424" y="812" class="clbl">issue</text>

  <!-- Memory column (right) -->
  <rect x="900" y="740" width="250" height="480" rx="8" fill="#fff8e1" stroke="#ffb300" stroke-width="1.4"/>
  <text x="1025" y="766" text-anchor="middle" class="stage" fill="#8d6e00">On-Chip Parameter Memory</text>
  <rect x="920" y="782" width="210" height="86" rx="6" fill="#ffffff" stroke="#ffca28"/>
  <text x="1025" y="808" text-anchor="middle" class="small" font-weight="600">Weight RAM Array</text>
  <text x="1025" y="828" text-anchor="middle" class="tiny">192 dual-port block RAMs</text>
  <text x="1025" y="846" text-anchor="middle" class="tiny">(3 neurons &#215; 64 inputs)</text>
  <text x="1025" y="980" text-anchor="middle" class="tiny" fill="#8d6e00">parameters written once</text>
  <text x="1025" y="998" text-anchor="middle" class="tiny" fill="#8d6e00">by the host before inference</text>
  <rect x="920" y="1116" width="210" height="86" rx="6" fill="#ffffff" stroke="#ffca28"/>
  <text x="1025" y="1146" text-anchor="middle" class="small" font-weight="600">Bias RAM Bank</text>
  <text x="1025" y="1166" text-anchor="middle" class="tiny">3 dual-port block RAMs</text>
  <text x="1025" y="1184" text-anchor="middle" class="tiny">one per parallel neuron</text>

  <!-- memory to datapath -->
  <line x1="900" y1="825" x2="830" y2="825" stroke="#c77800" stroke-width="2" marker-end="url(#aGold)"/>
  <text x="836" y="818" class="glbl">weights</text>
  <line x1="900" y1="1159" x2="830" y2="1159" stroke="#c77800" stroke-width="2" marker-end="url(#aGold)"/>
  <text x="845" y="1152" class="glbl">bias</text>

  <!-- Feedback loop: bias/act back to buffer (clear left channel) -->
  <path d="M540,1220 L540,1256 L75,1256 L75,672 L470,672" fill="none" stroke="#ef6c00" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#aAmber)"/>
  <text x="150" y="1248" class="flbl">layer-to-layer write-back (ping-pong feedback)</text>

  <!-- Result -->
  <line x1="650" y1="1220" x2="650" y2="1300" stroke="#37474f" stroke-width="2.2" marker-end="url(#aGray)"/>
  <text x="660" y="1262" class="dlbl">output scores</text>
  <rect x="470" y="1300" width="360" height="80" rx="8" fill="#ffffff" stroke="#1976d2" stroke-width="1.6"/>
  <text x="650" y="1330" text-anchor="middle" class="block" fill="#0d47a1">Classification Result (3 scores)</text>
  <text x="650" y="1356" text-anchor="middle" class="small">e.g. BUY / HOLD / SELL decision</text>

  <!-- Read-back: result up the right channel to DDR -->
  <path d="M830,1340 L1180,1340 L1180,235 L1100,235 L1100,224" fill="none" stroke="#ef6c00" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#aAmber)"/>
  <text x="1000" y="1330" text-anchor="middle" class="flbl">result read-back (AXI4-Lite)</text>

  <!-- Legend -->
  <rect x="40" y="1474" width="1160" height="70" rx="8" fill="#fafafa" stroke="#cfd8dc"/>
  <text x="60" y="1500" class="small" font-weight="700">Legend</text>
  <rect x="140" y="1490" width="18" height="14" fill="#e8f5e9" stroke="#43a047"/><text x="164" y="1502" class="small">Datapath (DSP / logic)</text>
  <rect x="350" y="1490" width="18" height="14" fill="#fff8e1" stroke="#ffb300"/><text x="374" y="1502" class="small">On-chip memory (BRAM)</text>
  <rect x="580" y="1490" width="18" height="14" fill="#ede7f6" stroke="#7e57c2"/><text x="604" y="1502" class="small">Control / FSM</text>
  <rect x="740" y="1490" width="18" height="14" fill="#e3f2fd" stroke="#64b5f6"/><text x="764" y="1502" class="small">AXI interface</text>
  <line x1="900" y1="1497" x2="940" y2="1497" stroke="#ef6c00" stroke-width="2" stroke-dasharray="6 4"/><text x="948" y="1502" class="small">Feedback / read-back</text>
  <text x="60" y="1528" class="tiny">All arithmetic in Q8.8 fixed-point (16-bit) with 40-bit accumulators. Network depth and per-layer widths are runtime-configurable.</text>
</svg>
